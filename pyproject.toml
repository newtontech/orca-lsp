[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orca-lsp"
version = "0.5.5rc1"
description = "Language Server Protocol for ORCA quantum chemistry software"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "NewtonTech"},
]
keywords = ["orca", "lsp", "language-server", "quantum-chemistry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "pygls>=1.2.0,<2.0.0",
    "lsprotocol>=2023.0.0",
]

[project.urls]
Homepage = "https://github.com/newtontech/orca-lsp"
Issues = "https://github.com/newtontech/orca-lsp/issues"
Repository = "https://github.com/newtontech/orca-lsp"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "pre-commit>=3.0",
]

[project.scripts]
orca-lsp = "orca_lsp.server:main"
orca-lsp-tool = "orca_lsp.tool:main"


[tool.hatch.build.force-include]
"skill" = "skill"

[tool.hatch.build.targets.wheel]
packages = ["src/orca_lsp"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["orca_lsp"]
branch = true
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
    "..."
]

